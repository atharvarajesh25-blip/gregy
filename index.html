function normalize(d){
 let x=d||defaults(); x.version=4;
 x.areas=x.areas||defaults().areas;x.goals=x.goals||[];x.projects=x.projects||[];x.tasks=x.tasks||[];x.habits=x.habits||[];
 x.study=x.study||{target:60,sessions:{},chapters:[]};x.study.sessions=x.study.sessions||{};x.study.chapters=x.study.chapters||[];
 x.sleep=x.sleep||{goal:8,entries:[]};x.sleep.entries=x.sleep.entries||[];x.skills=x.skills||{current:null,history:[]};
 x.money=x.money||{transactions:[],savingsGoal:0,budget:0};x.notes=x.notes||{};x.inbox=x.inbox||[];x.links=x.links||[];x.undo=x.undo||[];x.mood=x.mood||{};x.water=x.water||{};
 x.habits.forEach(h=>{h.history=h.history||{};h.areaId=h.areaId||'';h.priority=h.priority||2;h.duration=+h.duration||0});
 x.goals.forEach(g=>{g.type=g.type||'overall';g.metric=g.metric||'completion';g.target=+g.target||1;g.progress=+g.progress||0;g.areaId=g.areaId||''});
 return x;
}

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}
window.closeModal=()=>document.getElementById('modal').classList.remove('open');

function areaName(id){return data.areas.find(x=>x.id===id)?.name||'Unassigned'}
function goalName(id){return data.goals.find(x=>x.id===id)?.title||'Unknown goal'}
function projectName(id){return data.projects.find(x=>x.id===id)?.name||'Unknown project'}
function isDone(x,date=iso(state.date)){return !!x.history?.[date]}
function linked(id){return data.links.filter(l=>l.from===id||l.to===id)}
function linksTo(id){return data.links.filter(l=>l.to===id).map(l=>l.from)}
function linksFrom(id){return data.links.filter(l=>l.from===id).map(l=>l.to)}
function noteEntities(){return Object.entries(data.notes||{}).map(([id,n])=>({...n,id,kind:'note'}))}
function allEntities(){return [...data.areas,...data.goals,...data.projects,...data.tasks,...data.habits,...data.study.chapters.map(x=>({...x,kind:'chapter'})),...(data.skills.current?[data.skills.current]:[]),...noteEntities()]}
function entity(id){return allEntities().find(x=>x.id===id)}
function kindOf(id){
 if(data.areas.some(x=>x.id===id))return'Area';if(data.goals.some(x=>x.id===id))return'Goal';if(data.projects.some(x=>x.id===id))return'Project';if(data.tasks.some(x=>x.id===id))return'Task';if(data.habits.some(x=>x.id===id))return'Habit';if(data.study.chapters.some(x=>x.id===id))return'Study';if(data.skills.current?.id===id)return'Skill';if(Object.prototype.hasOwnProperty.call(data.notes||{},id))return'Note';return'Item';
}
function titleOf(id){let e=entity(id);return e?.name||e?.title||'Item'}
function pct(n,t){return Math.max(0,Math.min(100,Math.round((n/Math.max(1,t))*100)))}
function priority(p){return `<span class="priority p${p}">P${p}</span>`}

function nav(){

}
function renderTab(t){state.tab=t;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));let page=document.getElementById('page-'+t);if(page)page.classList.add('active');let n=tabs.find(x=>x[0]===t)?.[1]||t;document.getElementById('pageTitle').textContent=n;document.getElementById('pageSub').textContent={today:'One system. Everything connected.',inbox:'Capture first. Organize later.',areas:'The life areas your system supports.',goals:'Outcomes with measurable progress.',projects:'Projects turn goals into deliverables.',tasks:'Every action can connect upward.',habits:'Recurring actions that feed your goals.',study:'Time and chapters, linked to outcomes.',sleep:'Recovery as part of the system.',skills:'Skills, projects and tangible output.',money:'Income, spending and savings.',connections:'See how everything feeds everything.',stats:'Evidence, trends and actionable signals.',notes:'Notes that can connect to the system.'}[t]||'';renderPage(t);nav();document.getElementById('backBtn').style.visibility=t==='today'?'hidden':'visible'}
function tabFromHash(){let m=location.hash.match(/^#ts=(.+)$/);return tabs.some(x=>x[0]===m?.[1])?m[1]:'today'}
window.go=(t,push=true)=>{if(!tabs.some(x=>x[0]===t))return;if(push&&t!==state.tab){location.hash='ts='+t;return}renderTab(t)};
window.addEventListener('hashchange',()=>renderTab(tabFromHash()));
window.appBack=()=>{if(state.tab==='today')return;try{history.back()}catch(e){location.hash=''}};
document.getElementById('backBtn').onclick=()=>window.appBack();


function datebar(){return `<div class="datebar"><button class="iconbtn" onclick="shift(-1)">‹</button><div class="date">${fmt(state.date)}</div><button class="iconbtn" onclick="shift(1)">›</button><button class="btn small" onclick="jumpToday()">Today</button><button class="btn small" onclick="datePicker()">Date</button></div>`}
window.shift=n=>{state.date=add(state.date,n);renderPage(state.tab)}
window.jumpToday=()=>{state.date=new Date();renderPage(state.tab)}
window.datePicker=()=>openModal('Jump to date',`<div class="form"><input id="pickDate" type="date" value="${iso(state.date)}"><button class="btn primary" onclick="state.date=day(document.getElementById('pickDate').value);closeModal();renderPage(state.tab)">Open date</button></div>`);

function actionBtn(action,label,attrs=''){return `<button class="btn small" data-action="${action}" ${attrs}>${label}</button>`}
function connectBtn(id){return `<button class="btn small" onclick="connect('${id}')">↗ Connect</button>`}
window.connect=id=>{
 let opts=allEntities().filter(x=>x.id!==id);
 openModal('Connect to',`<div class="small" style="margin-bottom:10px">Connecting <b>${esc(titleOf(id))}</b>. Choose a relationship.</div><div class="stack">${opts.map(x=>`<label class="item row"><input type="checkbox" value="${x.id}" ${data.links.some(l=>(l.from===id&&l.to===x.id)||(l.to===id&&l.from===x.id))?'checked':''}> <span><b>${esc(x.name||x.title)}</b><span class="mini"> · ${kindOf(x.id)}</span></span></label>`).join('')}</div><button class="btn primary" style="margin-top:12px;width:100%" onclick="saveConnections('${id}')">Save connections</button>`);
}
window.saveConnections=id=>{
 let checks=[...document.querySelectorAll('#modalBody input[type=checkbox]')].filter(x=>x.checked).map(x=>x.value);

function taskCard(t,source='task'){
 let done=source==='habit'?isDone(t):t.done;
 return `<div class="item row between"><div class="row" style="flex:1"><button class="check ${done?'done':''}" onclick="${source==='habit'?`toggleHabit('${t.id}')`:`toggleTask('${t.id}')`}">${done?'✓':''}</button><div><div class="title">${esc(t.name||t.title)} ${priority(t.priority||2)}</div><div class="mini">${source==='habit'?`${t.cadence||'daily'} · ${t.duration||0}m`:`${t.duration||0}m · ${t.status||'open'}`}${t.areaId?' · '+esc(areaName(t.areaId)):''}</div></div></div><div class="row">${source==='task'?`<button class="btn small" onclick="editTask('${t.id}')">Edit</button>`:`<button class="btn small" onclick="editHabit('${t.id}')">Edit</button>`} ${connectBtn(t.id)} <button class="btn small danger" onclick="deleteEntity('${t.id}','${source}')">×</button></div></div>`
}
window.toggleHabit=id=>{let h=data.habits.find(x=>x.id===id);h.history=h.history||{};let d=iso(state.date);h.history[d]=!h.history[d];save();renderPage(state.tab);toast(h.history[d]?'Completed · progress rolled up':'Unchecked')}
window.toggleTask=id=>{let t=data.tasks.find(x=>x.id===id);t.done=!t.done;t.completedAt=t.done?iso(state.date):null;save();renderPage(state.tab)}
window.deleteEntity=(id,type)=>{
 let snapshot=JSON.stringify(data);data.undo.push(snapshot);if(type==='habit')data.habits=data.habits.filter(x=>x.id!==id);else if(type==='task')data.tasks=data.tasks.filter(x=>x.id!==id);else if(type==='project')data.projects=data.projects.filter(x=>x.id!==id);else if(type==='goal')data.goals=data.goals.filter(x=>x.id!==id);else if(type==='area')data.areas=data.areas.filter(x=>x.id!==id);data.links=data.links.filter(l=>l.from!==id&&l.to!==id);save();renderPage(state.tab);toast('Deleted · Undo available in Settings')}
window.undo=()=>{if(!data.undo.length)return toast('Nothing to undo');data=normalize(JSON.parse(data.undo.pop()));save();renderPage(state.tab);toast('Undo complete')}

function periodStats(){
 let d=iso(state.date), hs=data.habits.filter(h=>isDone(h,d)).length, ts=data.tasks.filter(t=>t.completedAt===d).length;
 let study=data.study.sessions[d]||0;let se=data.sleep.entries.find(x=>x.date===d);let sl=se?sleepDuration(se.bed,se.wake):0;
 let week=weekStart(state.date),wDays=Array.from({length:7},(_,i)=>iso(add(week,i)));
 let hw=wDays.reduce((s,z)=>s+data.habits.filter(h=>isDone(h,z)).length,0),tw=wDays.reduce((s,z)=>s+data.tasks.filter(t=>t.completedAt===z).length,0);
 return{hs,ts,study,sl,hw,tw}
}
function sleepDuration(a,b){if(!a||!b)return 0;let [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number),x=ah*60+am,y=bh*60+bm;if(y<=x)y+=1440;return(y-x)/60}

window.dashAddQuick=()=>{
  let text=(document.getElementById('dashCapture')?.value||'').trim();
  if(dashQuickMode==='study'){
    let n=+document.getElementById('dashStudyMinutes')?.value||0; if(n<=0)return toast('Enter study minutes'); let d=iso(state.date); data.study.sessions[d]=(data.study.sessions[d]||0)+n; save(); renderPage('today'); toast('Study logged'); return;
  }
  if(!text)return toast('Enter something first');
  if(dashQuickMode==='task'){
    data.tasks.push({id:uid(),name:text,done:false,status:'open',priority:+document.getElementById('dashPriority').value||2,duration:+document.getElementById('dashMinutes').value||0,scheduledDate:document.getElementById('dashDate').value,areaId:'',projectId:''}); toast('Task added');
  } else if(dashQuickMode==='note'){
    let id=uid(),title=(document.getElementById('dashNoteTitle')?.value||'Quick note').trim(); data.notes[id]={title:title||'Quick note',body:text,date:iso(state.date)}; toast('Note added');
  } else if(dashQuickMode==='expense'){
    let amount=+document.getElementById('dashAmount').value||0;if(amount<=0)return toast('Enter an amount'); data.money.transactions.push({id:uid(),date:iso(state.date),type:'expense',amount,note:text,category:(document.getElementById('dashCategory').value||'Others').trim()}); toast('Expense added');
  } else if(dashQuickMode==='idea'){
    data.inbox.unshift({id:uid(),text,kind:'idea',createdAt:new Date().toLocaleString()}); toast('Idea saved');
  }
  save(); renderPage('today');
};

function goalFlow(g){let kids=linksTo(g.id).map(entity).filter(Boolean);return `<div class="connection"><div class="node-type">OVERALL GOAL · ${esc(areaName(g.areaId))}</div><div class="node-title">${esc(g.title)}</div><div class="progress"><div class="progress-line"><span>${goalProgress(g)} / ${g.target} ${metricLabel(g.metric)}</span><span>${goalPct(g)}%</span></div><div class="bar"><i style="width:${goalPct(g)}%"></i></div></div><div class="linkchips">${kids.slice(0,7).map(x=>`<span class="chip">${esc(x.name||x.title)}</span>`).join('')||'<span class="mini">No actions connected yet</span>'}</div></div>`}
function metricLabel(m){return{completion:'done',count:'count',duration:'min',amount:'₹',quantity:'units',average:'avg'}[m]||'units'}
function goalPeriodDates(g){return null}
function goalProgress(g){
 let ids=linksTo(g.id),n=0;
 if(g.metric==='amount') return data.money.transactions.filter(t=>t.type==='saving').reduce((s,t)=>s+Number(t.amount||0),0)+Number(g.progress||0);
 ids.forEach(id=>{
  let h=data.habits.find(x=>x.id===id);
  if(h){
   let days=Object.keys(h.history||{});
   if(g.metric==='duration') n+=days.filter(d=>isDone(h,d)).reduce((s,d)=>s+Number(h.duration||0),0);
   else n+=days.filter(d=>isDone(h,d)).length;
  }
  let t=data.tasks.find(x=>x.id===id);
  if(t && t.done) n+=1;
  let c=data.study.chapters.find(x=>x.id===id);
  if(c) n+=Number(c.done||0);
  let sk=data.skills.current;
  if(sk && sk.id===id){if(g.metric==='duration') n+=Number(sk.practice||0); else n+=Number(sk.output||0);}
 });
 return n+Number(g.progress||0);
}
function goalPct(g){return pct(goalProgress(g),g.target)}

function renderNotes(){
 let entries=Object.entries(data.notes);
 document.getElementById('page-notes').innerHTML=`<div class="head"><div><h2>Notes</h2><div class="small">Capture context and connect important notes to the system.</div></div><button class="btn primary" onclick="addNote()">+ Note</button></div><div class="grid">${entries.map(([id,n])=>`<div class="card span-6"><div class="head"><h2>${esc(n.title||'Untitled')}</h2><button class="btn small danger" onclick="delete data.notes['${id}'];save();renderPage('notes')">×</button></div><div style="white-space:pre-wrap">${esc(n.body||'')}</div><div class="row" style="margin-top:12px">${connectBtn(id)}</div></div>`).join('')||'<div class="card span-12"><div class="empty">No notes yet.</div></div>'}</div>`;
}

function renderPage(t){({today:renderToday,inbox:renderInbox,areas:renderAreas,goals:renderGoals,projects:renderProjects,tasks:renderTasks,habits:renderHabits,study:renderStudy,sleep:renderSleep,skills:renderSkills,money:renderMoney,connections:renderConnections,stats:renderStats,notes:renderNotes}[t]||renderToday)()}

function quickCapture(){openModal('Quick capture',`<input id="captureText" style="width:100%;border:1px solid var(--line);padding:11px;border-radius:10px" placeholder="Anything on your mind…"><button class="btn primary" style="margin-top:10px;width:100%" onclick="data.inbox.unshift({id:uid(),text:document.getElementById('captureText').value,createdAt:new Date().toLocaleString()});save();closeModal();renderPage('inbox');toast('Captured')">Add to inbox</button>`)}
window.convertInbox=i=>{let x=data.inbox[i];data.tasks.push({id:uid(),name:x.text,done:false,status:'open',priority:2,duration:0,scheduledDate:iso(state.date),projectId:'',areaId:''});data.inbox.splice(i,1);save();renderPage('inbox');toast('Converted to task')}

function quickAddTask(projectId=''){openModal('New task',`<div class="form"><input id="tn" placeholder="Task name" style="flex:1"><select id="tp"><option value="1">P1</option><option value="2" selected>P2</option><option value="3">P3</option></select><input id="td" type="number" placeholder="Minutes" value="30"><input id="tsd" type="date" value="${iso(state.date)}"><select id="ta"><option value="">Area</option>${data.areas.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><select id="tproj"><option value="">Project</option>${data.projects.map(p=>`<option value="${p.id}" ${p.id===projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><button class="btn primary" style="margin-top:12px;width:100%" onclick="data.tasks.push({id:uid(),name:document.getElementById('tn').value,done:false,status:'open',priority:+document.getElementById('tp').value,duration:+document.getElementById('td').value||0,scheduledDate:document.getElementById('tsd').value,areaId:document.getElementById('ta').value,projectId:document.getElementById('tproj').value});save();closeModal();renderPage(state.tab);toast('Task added')">Create task</button>`)}
function addHabit(){openModal('New habit',`<div class="form"><input id="hn" placeholder="Habit name" style="flex:1"><input id="hd" type="number" placeholder="Minutes" value="20"><select id="ha"><option value="">Area</option>${data.areas.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><select id="hc"><option>daily</option><option>weekly</option></select></div><button class="btn primary" style="margin-top:12px;width:100%" onclick="data.habits.push({id:uid(),name:document.getElementById('hn').value,areaId:document.getElementById('ha').value,cadence:document.getElementById('hc').value,priority:2,duration:+document.getElementById('hd').value||0,history:{}});save();closeModal();renderPage('habits');toast('Habit added')">Create habit</button>`)}
function addArea(){openModal('New area',`<div class="form"><input id="an" placeholder="Area name" style="flex:1"><input id="ad" placeholder="Description" style="flex:1"></div><button class="btn primary" style="margin-top:12px;width:100%" onclick="data.areas.push({id:uid(),name:document.getElementById('an').value,desc:document.getElementById('ad').value});save();closeModal();renderPage('areas')">Create area</button>`)}
function addGoal(){openModal('New goal',`<div class="form"><input id="gn" placeholder="Goal title" style="flex:1"><select id="gm"><option value="completion">Completion</option><option value="count">Count</option><option value="duration">Duration</option><option value="amount">Amount</option><option value="quantity">Quantity</option><option value="average">Average</option></select><input id="gtarget" type="number" value="10" min="1"><select id="ga">${data.areas.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><textarea id="gwhy" placeholder="Why does this matter?" style="margin-top:8px"></textarea><button class="btn primary" style="margin-top:10px;width:100%" onclick="data.goals.push({id:uid(),title:document.getElementById('gn').value,type:'overall',metric:document.getElementById('gm').value,target:+document.getElementById('gtarget').value||1,progress:0,areaId:document.getElementById('ga').value,why:document.getElementById('gwhy').value,parentId:null});save();closeModal();renderPage(state.tab);toast('Goal created')">Create goal</button>`)}
function editGoal(id){let g=data.goals.find(x=>x.id===id);openModal('Edit goal',`<div class="form"><input id="eg" value="${esc(g.title)}" style="flex:1"><input id="et" type="number" value="${g.target}"><select id="ea">${data.areas.map(a=>`<option value="${a.id}" ${a.id===g.areaId?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><textarea id="ew" style="margin-top:8px">${esc(g.why||'')}</textarea><button class="btn primary" style="margin-top:10px;width:100%" onclick="g.title=document.getElementById('eg').value;g.target=+document.getElementById('et').value||1;g.areaId=document.getElementById('ea').value;g.why=document.getElementById('ew').value;save();closeModal();renderPage(state.tab)">Save</button>`)}
function addProject(){openModal('New project',`<div class="form"><input id="pn" placeholder="Project name" style="flex:1"><select id="pa">${data.areas.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><button class="btn primary" style="margin-top:12px;width:100%" onclick="data.projects.push({id:uid(),name:document.getElementById('pn').value,areaId:document.getElementById('pa').value,status:'active'});save();closeModal();renderPage('projects')">Create project</button>`)}
function editProject(id){let p=data.projects.find(x=>x.id===id);openModal('Edit project',`<div class="form"><input id="ep" value="${esc(p.name)}" style="flex:1"></div><button class="btn primary" style="margin-top:12px" onclick="p.name=document.getElementById('ep').value;save();closeModal();renderPage('projects')">Save</button>`)}
function addChapter(){openModal('Add study chapter',`<div class="form"><input id="cn" placeholder="Chapter / topic" style="flex:1"><input id="ct" type="number" value="1" min="1"></div><button class="btn primary" style="margin-top:12px;width:100%" onclick="data.study.chapters.push({id:uid(),name:document.getElementById('cn').value,total:+document.getElementById('ct').value||1,done:0});save();closeModal();renderPage('study')">Add chapter</button>`)}
function chapterStep(id,n){let c=data.study.chapters.find(x=>x.id===id);c.done=Math.min(c.total,c.done+n);save();renderPage('study')}
function logStudy(){openModal('Log study',`<div class="form"><input id="sm" type="number" value="30" min="1"><button class="btn primary" onclick="let n=+document.getElementById('sm').value||0;data.study.sessions['${iso(state.date)}']=(data.study.sessions['${iso(state.date)}']||0)+n;save();closeModal();renderPage('study')">Add minutes</button></div>`)}
function saveSleep(){let d=iso(state.date),bed=document.getElementById('bed').value,wake=document.getElementById('wake').value;data.sleep.goal=+document.getElementById('sleepGoal').value||8;data.sleep.entries=data.sleep.entries.filter(x=>x.date!==d);data.sleep.entries.push({date:d,bed,wake});save();renderPage('sleep');toast('Sleep saved')}
function setSkill(){openModal('Current skill',`<input id="sk" style="width:100%" placeholder="e.g. Excel, CapCut, Data Analysis"><button class="btn primary" style="margin-top:10px;width:100%" onclick="let n=document.getElementById('sk').value;data.skills.current={id:uid(),name:n,practice:0,output:0};save();closeModal();renderPage('skills')">Set skill</button>`)}
function logSkill(){if(!data.skills.current)return setSkill();openModal('Log skill work',`<div class="form"><input id="sp" type="number" value="30" placeholder="Practice min"><input id="so" type="number" value="1" placeholder="Outputs"><button class="btn primary" onclick="data.skills.current.practice+=+document.getElementById('sp').value||0;data.skills.current.output+=+document.getElementById('so').value||0;save();closeModal();renderPage('skills')">Log</button></div>`)}
function editTask(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;openModal('Edit task',`<div class="form"><input id="etn" value="${esc(t.name)}" style="flex:1"><select id="etp"><option value="1" ${t.priority===1?'selected':''}>P1</option><option value="2" ${t.priority===2?'selected':''}>P2</option><option value="3" ${t.priority===3?'selected':''}>P3</option></select><input id="etd" type="number" value="${t.duration||0}"><input id="etsd" type="date" value="${t.scheduledDate||iso(state.date)}"></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="t.name=document.getElementById('etn').value;t.priority=+document.getElementById('etp').value;t.duration=+document.getElementById('etd').value||0;t.scheduledDate=document.getElementById('etsd').value;save();closeModal();renderPage(state.tab)">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function editHabit(id){let h=data.habits.find(x=>x.id===id);if(!h)return;openModal('Edit habit',`<div class="form"><input id="ehn" value="${esc(h.name)}" style="flex:1"><input id="ehd" type="number" value="${h.duration||0}"><select id="eha">${data.areas.map(a=>`<option value="${a.id}" ${a.id===h.areaId?'selected':''}>${esc(a.name)}</option>`).join('')}</select><select id="ehc"><option ${h.cadence==='daily'?'selected':''}>daily</option><option ${h.cadence==='weekly'?'selected':''}>weekly</option></select></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="h.name=document.getElementById('ehn').value;h.duration=+document.getElementById('ehd').value||0;h.areaId=document.getElementById('eha').value;h.cadence=document.getElementById('ehc').value;save();closeModal();renderPage('habits')">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function editMoney(id){let t=data.money.transactions.find(x=>x.id===id);if(!t)return;openModal('Edit transaction',`<div class="form"><input id="ema" type="number" value="${t.amount||0}"><select id="emt"><option ${t.type==='income'?'selected':''}>income</option><option ${t.type==='expense'?'selected':''}>expense</option><option ${t.type==='saving'?'selected':''}>saving</option></select><select id="emc"><option ${t.category==='Food'?'selected':''}>Food</option><option ${t.category==='Transport'?'selected':''}>Transport</option><option ${t.category==='Shopping'?'selected':''}>Shopping</option><option ${t.category==='Education'?'selected':''}>Education</option><option ${t.category==='Others'?'selected':''}>Others</option></select><input id="emn" value="${esc(t.note||'')}" style="flex:1"></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="t.amount=+document.getElementById('ema').value||0;t.type=document.getElementById('emt').value;t.category=document.getElementById('emc').value;t.note=document.getElementById('emn').value;save();closeModal();renderPage('money')">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function addMoney(){openModal('Transaction',`<div class="form"><select id="mt"><option>income</option><option>expense</option><option>saving</option></select><input id="ma" type="number" placeholder="Amount" min="0"><select id="mc"><option>Food</option><option>Transport</option><option>Shopping</option><option>Education</option><option>Others</option></select><input id="mn" placeholder="Note" style="flex:1"></div><div class="row" style="margin-top:12px"><button class="btn primary" style="flex:1" onclick="let a=+document.getElementById('ma').value||0;if(a<=0)return toast('Enter an amount');data.money.transactions.push({id:uid(),date:'${iso(state.date)}',type:document.getElementById('mt').value,category:document.getElementById('mc').value,amount:a,note:document.getElementById('mn').value});save();closeModal();renderPage('money');toast('Transaction saved')">Save transaction</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function removeMoney(i){data.money.transactions.splice(i,1);save();renderPage('money');toast('Transaction removed')}
function editMoneySettings(){openModal('Savings & budget',`<div class="form"><input id="sg" type="number" value="${data.money.savingsGoal}" placeholder="Savings goal"><input id="bu" type="number" value="${data.money.budget}" placeholder="Monthly budget"><button class="btn primary" onclick="data.money.savingsGoal=+document.getElementById('sg').value||0;data.money.budget=+document.getElementById('bu').value||0;save();closeModal();renderPage('money')">Save</button></div>`)}
function addNote(){openModal('New note',`<input id="nt" style="width:100%" placeholder="Title"><textarea id="nb" placeholder="Write your note…" style="margin-top:8px"></textarea><button class="btn primary" style="margin-top:10px;width:100%" onclick="let id=uid();data.notes[id]={title:document.getElementById('nt').value,body:document.getElementById('nb').value};save();closeModal();renderPage('notes')">Save note</button>`)}
function connectPicker(){let opts=allEntities();openModal('Choose something to connect',`<div class="list">${opts.map(x=>`<button class="item" style="text-align:left" onclick="closeModal();connect('${x.id}')"><b>${esc(x.name||x.title)}</b><span class="mini"> · ${kindOf(x.id)}</span></button>`).join('')}</div>`)}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ts-personal-os-v4-backup.json';a.click()}
function settings(){openModal('TS Settings',`<div class="stack"><button class="btn" onclick="backup()">Export backup</button><label class="btn">Import backup<input id="restore" type="file" accept=".json" style="display:none"></label><button class="btn" onclick="undo()">Undo last delete</button><button class="btn danger" onclick="if(confirm('Erase all TS data?')){data=defaults();save();closeModal();go('today')}">Erase all data</button><div class="small">Your data is stored locally in this browser. Export before moving devices.</div></div>`);setTimeout(()=>{let r=document.getElementById('restore');r.onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{data=normalize(JSON.parse(rd.result));save();closeModal();go(state.tab);toast('Backup restored')}catch{toast('Invalid backup')}};rd.readAsText(f)}} ,0)}
// Expose action handlers used by inline buttons. The app is wrapped in an IIFE,
// so these functions must be attached to window for onclick="..." handlers to reach them.
Object.assign(window,{
  nav,save,addArea,addGoal,addProject,addHabit,addChapter,quickCapture,quickAddTask,setQuickMode,dashAddQuick,
  logStudy,saveSleep,setSkill,logSkill,addMoney,removeMoney,editMoneySettings,addNote,
  connectPicker,backup,settings,editGoal,editProject,chapterStep,
  renderPage,renderToday,renderInbox,renderAreas,renderGoals,
  renderProjects,renderTasks,renderHabits,renderStudy,renderSleep,renderSkills,renderMoney,
  renderConnections,renderStats,renderNotes
});

document.getElementById('settingsBtn').onclick=settings;
document.getElementById('searchBtn').onclick=()=>{document.getElementById('search').classList.add('open');document.getElementById('searchInput').focus()};
document.getElementById('search').onclick=e=>{if(e.target.id==='search')e.currentTarget.classList.remove('open')};
document.getElementById('searchInput').oninput=e=>{let q=e.target.value.toLowerCase();let all=allEntities().filter(x=>(x.name||x.title||'').toLowerCase().includes(q));document.getElementById('results').innerHTML=q?all.slice(0,30).map(x=>`<div class="result" onclick="document.getElementById('search').classList.remove('open');connect('${x.id}')"><b>${esc(x.name||x.title)}</b><span class="mini"> · ${kindOf(x.id)}</span></div>`).join('')||'<div class="empty">No matches.</div>':''};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('searchBtn').click()}});
// Global bridge for inline button handlers. The app uses an IIFE for state safety,
// so expose the action functions and live state explicitly to HTML onclick handlers.
Object.assign(window, {
  defaults, normalize, save, toast, openModal, areaName, goalName, projectName,
  isDone, linked, linksTo, linksFrom, entity, kindOf, titleOf, pct, priority,
  nav, datebar, actionBtn, connectBtn, taskCard, periodStats, sleepDuration,
  renderToday, goalFlow, metricLabel, goalPeriodDates, goalProgress, goalPct,
  renderInbox, renderAreas, renderGoals, renderProjects,
  renderTasks, renderHabits, renderStudy, renderSleep, renderSkills, renderMoney,
  renderConnections, renderStats, renderNotes, renderPage, quickCapture,
  quickAddTask, addHabit, addArea, addGoal, editGoal, addProject, editProject,
  addChapter, chapterStep, logStudy, saveSleep, setSkill, logSkill, addMoney,
  removeMoney, editMoneySettings, editTask, editHabit, editMoney, addNote, connectPicker, backup, settings,
  uid, iso, day, setGoalFilter
});
Object.defineProperty(window, 'data', { configurable:true, get:()=>data, set:v=>{data=v;} });
Object.defineProperty(window, 'state', { configurable:true, get:()=>state, set:v=>{Object.assign(state,v||{});} });

renderTab(tabFromHash());
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>

</body>
